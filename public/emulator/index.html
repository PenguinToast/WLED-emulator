<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EDC WLED Output Emulator</title>
  </head>
  <body>
    <main class="shell">
      <section class="preview">
        <header class="topbar">
          <div>
            <h1>Virtual WLED Output</h1>
            <p id="status">Connecting to WLED protocol emulator...</p>
          </div>
          <nav>
            <a href="/" target="_blank">WLED UI</a>
            <button id="micButton" type="button">Mic</button>
            <button id="computerAudioButton" type="button" title="Capture shared tab or system audio">Computer</button>
            <label class="fileButton">
              File
              <input id="fileInput" type="file" accept="audio/*">
            </label>
            <button id="stopButton" type="button">Stop</button>
            <button id="diffuserButton" class="toggleButton" type="button" aria-pressed="false" title="Preview output through a diffuser sheet">Diffuser</button>
          </nav>
        </header>

        <canvas id="ledCanvas" class="ledCanvas" width="1280" height="580"></canvas>
        <section class="spectrumPanel" aria-label="FFT bins">
          <div class="spectrumHeader">
            <h2>FFT Bins</h2>
            <div class="spectrumMeta">
              <span id="beatIndicator" class="beatIndicator">Beat</span>
              <span>16-band audio payload, bass to highs left-to-right</span>
            </div>
          </div>
          <canvas id="spectrumCanvas" width="1280" height="170"></canvas>
          <div class="controls" aria-label="Audio tuning">
            <label>
              <span>Input gain <output id="inputGainValue">1.00x</output></span>
              <input id="inputGainSlider" type="range" min="0.10" max="3.00" step="0.05" value="1.00">
            </label>
            <label>
              <span>FFT gain <output id="fftGainValue">1.00x</output></span>
              <input id="fftGainSlider" type="range" min="0.10" max="3.00" step="0.05" value="1.00">
            </label>
            <label>
              <span>Noise gate <output id="noiseGateValue">0.02</output></span>
              <input id="noiseGateSlider" type="range" min="0.00" max="0.15" step="0.005" value="0.02">
            </label>
            <label>
              <span>Smoothing <output id="smoothingValue">0.72</output></span>
              <input id="smoothingSlider" type="range" min="0.00" max="0.95" step="0.01" value="0.72">
            </label>
          </div>
        </section>
      </section>

      <aside>
        <section>
          <h2>WLED State</h2>
          <dl>
            <div><dt>Power</dt><dd id="powerReadout">-</dd></div>
            <div><dt>Brightness</dt><dd id="brightnessReadout">-</dd></div>
            <div><dt>Effect</dt><dd id="effectReadout">-</dd></div>
            <div><dt>Palette</dt><dd id="paletteReadout">-</dd></div>
            <div><dt>LEDs</dt><dd id="ledCountReadout">-</dd></div>
          </dl>
        </section>

        <section>
          <h2>Audio</h2>
          <dl>
            <div><dt>Volume</dt><dd id="volumeReadout">0.00</dd></div>
            <div><dt>Bass</dt><dd id="bassReadout">0.00</dd></div>
            <div><dt>Mid</dt><dd id="midReadout">0.00</dd></div>
            <div><dt>Treble</dt><dd id="trebleReadout">0.00</dd></div>
            <div><dt>BPM</dt><dd id="bpmReadout">-</dd></div>
          </dl>
          <audio id="audioPlayer" controls></audio>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/emulator/main.ts"></script>
  </body>
</html>
